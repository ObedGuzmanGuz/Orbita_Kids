ext x="484" y="955" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">Chrome, Edge o Safari</text><rect x="592" y="16" width="152" height="52" rx="10" fill="#FFFFFF" stroke="#5646DB" /><text x="668" y="38" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Service worker</text><text x="668" y="55" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">Workbox</text><rect x="592" y="916" width="152" height="52" rx="10" fill="#FFFFFF" stroke="#5646DB" /><text x="668" y="938" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Service worker</text><text x="668" y="955" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">Workbox</text><circle cx="314" cy="104" r="9" fill="#15173A"/><text x="314" y="107.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">1</text><text x="330" y="108" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Registra el service worker en el primer ingreso</text><circle cx="714" cy="150" r="9" fill="#15173A"/><text x="714" y="153.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">2</text><text x="728" y="154" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Precarga el app shell y los íconos</text><text x="728" y="170" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">(evento install)</text><circle cx="314" cy="202" r="9" fill="#15173A"/><text x="314" y="205.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">3</text><text x="330" y="206" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Dispara beforeinstallprompt; la</text><text x="330" y="222" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">app guarda el evento</text><circle cx="130" cy="264" r="9" fill="#15173A"/><text x="130" y="267.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">4</text><text x="146" y="268" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">«Instalar app» desde el panel o el</text><text x="146" y="284" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">sitio</text><a href="#prototipo" class="sq-chip" data-open="18" aria-label="Abrir en el prototipo: Instalar la app, Antes de instalar"><title>Instalar la app · Antes de instalar</title><rect x="798" y="253" width="56" height="22" rx="11"/><text x="826" y="268" text-anchor="middle">11a</text></a><circle cx="314" cy="326" r="9" fill="#15173A"/><text x="314" y="329.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">5</text><text x="330" y="330" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Llama a prompt() con el evento</text><text x="330" y="346" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">guardado</text><circle cx="130" cy="388" r="9" fill="#15173A"/><text x="130" y="391.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">6</text><text x="146" y="392" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Muestra el diálogo del navegador</text><a href="#prototipo" class="sq-chip" data-open="19" aria-label="Abrir en el prototipo: Instalar la app, Diálogo del navegador"><title>Instalar la app · Diálogo del navegador</title><rect x="798" y="377" width="56" height="22" rx="11"/><text x="826" y="392" text-anchor="middle">11b</text></a><circle cx="130" cy="434" r="9" fill="#15173A"/><text x="130" y="437.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">7</text><text x="146" y="438" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Confirma «Instalar»</text><circle cx="314" cy="480" r="9" fill="#15173A"/><text x="314" y="483.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">8</text><text x="330" y="484" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">userChoice: accepted y evento</text><text x="330" y="500" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">appinstalled</text><circle cx="314" cy="542" r="9" fill="#15173A"/><text x="314" y="545.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">9</text><text x="330" y="546" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Abre la ventana propia (display:</text><text x="330" y="562" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">standalone)</text><a href="#prototipo" class="sq-chip" data-open="20" aria-label="Abrir en el prototipo: Primer arranque instalada, Primer arranque"><title>Primer arranque instalada · Primer arranque</title><rect x="798" y="531" width="56" height="22" rx="11"/><text x="826" y="546" text-anchor="middle">12</text></a><circle cx="314" cy="604" r="9" fill="#15173A"/><text x="314" y="607.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">10</text><text x="330" y="608" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Pide el app shell</text><circle cx="314" cy="650" r="9" fill="#15173A"/><text x="314" y="653.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">11</text><text x="330" y="654" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Lo sirve desde la caché, incluso sin Internet</text><text x="86" y="712" fill="#5E6283" style="font-size:12px;font-weight:600">[Hay una versión nueva]</text><circle cx="314" cy="734" r="9