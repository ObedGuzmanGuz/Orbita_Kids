84" y="38" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Keycloak</text><text x="484" y="55" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">OIDC con PKCE</text><rect x="408" y="1124" width="152" height="52" rx="10" fill="#FFFFFF" stroke="#B9BDD0" /><text x="484" y="1146" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Keycloak</text><text x="484" y="1163" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">OIDC con PKCE</text><rect x="592" y="16" width="152" height="52" rx="10" fill="#F3F4F8" stroke="#B9BDD0" stroke-dasharray="4 3"/><text x="668" y="38" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Google o Microsoft</text><text x="668" y="55" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">proveedor de identidad</text><rect x="592" y="1124" width="152" height="52" rx="10" fill="#F3F4F8" stroke="#B9BDD0" stroke-dasharray="4 3"/><text x="668" y="1146" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">Google o Microsoft</text><text x="668" y="1163" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">proveedor de identidad</text><rect x="776" y="16" width="152" height="52" rx="10" fill="#FFFFFF" stroke="#B9BDD0" /><text x="852" y="38" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">API Órbita</text><text x="852" y="55" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">backend compartido</text><rect x="776" y="1124" width="152" height="52" rx="10" fill="#FFFFFF" stroke="#B9BDD0" /><text x="852" y="1146" text-anchor="middle" fill="#15173A" style="font-family:var(--f-disp);font-size:14px;font-weight:600">API Órbita</text><text x="852" y="1163" text-anchor="middle" fill="#5E6283" style="font-size:11.5px">backend compartido</text><circle cx="130" cy="104" r="9" fill="#15173A"/><text x="130" y="107.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">1</text><text x="146" y="108" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Abre orbitakids.example y elige</text><text x="146" y="124" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">«Explorar sin cuenta»</text><a href="#prototipo" class="sq-chip" data-open="50" aria-label="Abrir en el prototipo: Explorar sin cuenta, Vista docente"><title>Explorar sin cuenta · Vista docente</title><rect x="982" y="93" width="56" height="22" rx="11"/><text x="1010" y="108" text-anchor="middle">35a</text></a><circle cx="346" cy="166" r="9" fill="#15173A"/><text x="346" y="169.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">2</text><text x="360" y="170" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Carga los datos de demostración</text><text x="360" y="186" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">incluidos en la app, sin llamar a la</text><text x="360" y="202" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">API</text><circle cx="130" cy="234" r="9" fill="#15173A"/><text x="130" y="237.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">3</text><text x="146" y="238" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">«Iniciar sesión» y luego</text><text x="146" y="254" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">«Continuar con Google»</text><a href="#prototipo" class="sq-chip" data-open="4" aria-label="Abrir en el prototipo: Iniciar sesión, Métodos de acceso"><title>Iniciar sesión · Métodos de acceso</title><rect x="982" y="223" width="56" height="22" rx="11"/><text x="1010" y="238" text-anchor="middle">04a</text></a><circle cx="346" cy="296" r="9" fill="#15173A"/><text x="346" y="299.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">4</text><text x="360" y="300" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Genera code_verifier y code_challenge</text><text x="360" y="316" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">(PKCE)</text><circle cx="314" cy="348" r="9" fill="#15173A"/><text x="314" y="351.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">5</text><text x="330" y="352" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Redirige a /auth con</text><text x="330" y="368" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">code_challenge y</text><text x="330" y="384" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">kc_idp_hint=google</text><circle cx="498" cy="426" r="9" fill="#15173A"/><text x="498" y="429.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">6</text><text x="514" y="430" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Redirige al proveedor de identidad</text><circle cx="130" cy="472" r="9" fill="#15173A"/><text x="130" y="475.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">7</text><text x="146" y="476" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Elige su cuenta de la escuela</text><a href="#prototipo" class="sq-chip" data-open="7" aria-label="Abrir en el prototipo: Proveedor de identidad (simulado), Elegir identidad de Google"><title>Proveedor de identidad (simulado) · Elegir identidad de Google</title><rect x="982" y="461" width="56" height="22" rx="11"/><text x="1010" y="476" text-anchor="middle">05</text></a><circle cx="498" cy="518" r="9" fill="#15173A"/><text x="498" y="521.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">8</text><text x="514" y="522" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Devuelve la identidad verificada</text><circle cx="314" cy="564" r="9" fill="#15173A"/><text x="314" y="567.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">9</text><text x="330" y="568" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Vuelve a /app con un código de un</text><text x="330" y="584" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">solo uso</text><circle cx="314" cy="626" r="9" fill="#15173A"/><text x="314" y="629.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">10</text><text x="330" y="630" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Canjea el código junto con</text><text x="330" y="646" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">code_verifier</text><circle cx="314" cy="688" r="9" fill="#15173A"/><text x="314" y="691.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">11</text><text x="330" y="692" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Access token y refresh token con</text><text x="330" y="708" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">el rol</text><circle cx="314" cy="750" r="9" fill="#15173A"/><text x="314" y="753.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">12</text><text x="330" y="754" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">GET /me con el token</text><circle cx="314" cy="796" r="9" fill="#15173A"/><text x="314" y="799.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">13</text><text x="330" y="800" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Perfil, espacios y grupos</text><text x="86" y="858" fill="#5E6283" style="font-size:12px;font-weight:600">[Tiene dos roles]</text><circle cx="130" cy="880" r="9" fill="#15173A"/><text x="130" y="883.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">14</text><text x="146" y="884" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Muestra «Elegir espacio»</text><a href="#prototipo" class="sq-chip" data-open="16" aria-label="Abrir en el prototipo: Elegir espacio, Docente e institución"><title>Elegir espacio · Docente e institución</title><rect x="982" y="869" width="56" height="22" rx="11"/><text x="1010" y="884" text-anchor="middle">09</text></a><text x="38" y="938" fill="#5E6283" style="font-size:12px;font-weight:600">[Solo docente]</text><circle cx="130" cy="960" r="9" fill="#15173A"/><text x="130" y="963.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">15</text><text x="146" y="964" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.5px">Abre el inicio docente</text><a href="#prototipo" class="sq-chip" data-open="23" aria-label="Abrir en el prototipo: Inicio docente, En el navegador"><title>Inicio docente · En el navegador</title><rect x="982" y="949" width="56" height="22" rx="11"/><text x="1010" y="964" text-anchor="middle">15a</text></a><text x="38" y="1018" fill="#5E6283" style="font-size:12px;font-weight:600">[Cuenta de estudiante]</text><circle cx="130" cy="1040" r="9" fill="#15173A"/><text x="130" y="1043.5" text-anchor="middle" fill="#fff" style="font-size:10.5px;font-weight:600">16</text><text x="146" y="1044" fill="#15173A" stroke="#F7F7FA" stroke-width="5" paint-order="stroke" style="font-size:12.