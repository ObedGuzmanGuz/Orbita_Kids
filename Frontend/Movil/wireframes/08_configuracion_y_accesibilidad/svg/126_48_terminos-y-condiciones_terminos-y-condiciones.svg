e pausas y muévete.</text><text x="20.0" y="336.3" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="122.8" lengthAdjust="spacingAndGlyphs" >1. Uso educativo</text><text x="20.0" y="366.0" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="329.8" lengthAdjust="spacingAndGlyphs" >La plataforma apoya la práctica de matemáticas en</text><text x="20.0" y="387.0" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="221.7" lengthAdjust="spacingAndGlyphs" >primaria y no sustituye al docente.</text><text x="20.0" y="425.6" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="169.4" lengthAdjust="spacingAndGlyphs" >2. Cuentas de menores</text><text x="20.0" y="455.2" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="348.1" lengthAdjust="spacingAndGlyphs" >Las cuentas de estudiantes son proporcionadas por la</text><text x="20.0" y="476.3" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="264.4" lengthAdjust="spacingAndGlyphs" >institución o administradas por un adulto</text><text x="20.0" y="497.3" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="295.3" lengthAdjust="spacingAndGlyphs" >responsable. No se solicitan cuentas de redes</text><text x="20.0" y="518.3" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="126.4" lengthAdjust="spacingAndGlyphs" >sociales a menores.</text><text x="20.0" y="556.8" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="147.4" lengthAdjust="spacingAndGlyphs" >3. Datos personales</text><text x="20.0" y="586.5" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="273.9" lengthAdjust="spacingAndGlyphs" >Se tratan solo los datos necesarios para el</text><text x="20.0" y="607.5" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="343.5" lengthAdjust="spacingAndGlyphs" >aprendizaje y el seguimiento docente. Ver Privacidad.</text><text x="20.0" y="646.0" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="208.1" lengthAdjust="spacingAndGlyphs" >4. Sin publicidad ni compras</text><text x="20.0" y="675.7" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="287.9" lengthAdjust="spacingAndGlyphs" >La experiencia infantil no incluye anuncios ni</text><text x="20.0" y="696.7" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="58.5" lengthAdjust="spacingAndGlyphs" >compras.</text><text x="20.0" y="735.2" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="84.6" lengthAdjust="spacingAndGlyphs" >5. Licencias</text><text x="20.0" y="764.9" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="290.2" lengthAdjust="spacingAndGlyphs" >El acceso institucional depende de la licencia</text><text x="20.0" y="785.9" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="295.6" lengthAdjust="spacingAndGlyphs" >contratada por la escuela. Los planes son una</text><text x="20.0" y="807.0" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="140.9" lengthAdjust="spacingAndGlyphs" >propuesta académica.</text><text x="20.0" y="845.5" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#26262B" textLength="82.0" lengthAdjust="spacingAndGlyphs" >6. Cambios</text><text x="20.0" y="875.2" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="325.5" lengthAdjust="spacingAndGlyphs" >Este documento es un borrador y deberá validarse</text><text x="20.0" y="896.2" font-size="14.5" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#26262B" textLength="90.7" lengthAdjust="spacingAndGlyphs" >jurídicamente.</text><g class="gr"><rect x="20" y="0" width="75.5" height="930" fill="#FF5C7A" opacity="0.13"/><rect x="111.5" y="0" width="75.5" height="930" fill="#FF5C7A" opacity="0.13"/><rect x="203" y="0" width="75.5" height="930" fill="#FF5C7A" opacity="0.13"/><rect x="294.5" y="0" width="75.5" height="930" fill="#FF5C7A" opacity="0.13"/></g><text x="40" y="33" font-size="15" font-weight="700" font-family="Arial" fill="#26262B">9:41</text><rect x="306" y="23" width="18" height="11" rx="2" fill="#26262B" opacity=".8"/><rect x="330" y="23" width="16" height="11" rx="2" fill="#26262B" opacity=".8"/><rect x="352" y="22" width="24" height="12" rx="3.5" fill="none" stroke="#26262B" stroke-width="1.4" opacity=".8"/><rect x="128" y="917" width="134" height="5" rx="3" fill="#26262B" opacity=".7"/></g>
