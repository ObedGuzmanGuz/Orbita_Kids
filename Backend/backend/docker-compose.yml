# MySQL 8 para desarrollo local. Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: orbita-kids-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orbita_kids
      MYSQL_USER: orbita
      MYSQL_PASSWORD: orbita_dev
      MYSQL_ROOT_PASSWORD: orbita_root_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorbita", "-porbita_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
